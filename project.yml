name: CameraTestLab
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  CameraTestLab:
    type: application
    platform: iOS
    sources:
      - path: CameraTestLab
    settings:
      base:
        INFOPLIST_FILE: CameraTestLab/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CameraTestLab
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
